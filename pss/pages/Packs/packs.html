<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Pack</title>
    <link rel="stylesheet" href="../../assets/styles/packs.css" />
</head>
<body>

    <!-- ── TOP BAR ───────────────────────────────────────── -->
    <div class="topbar">
        <button class="topbar-btn" id="backBtn" aria-label="Back to sets">
            &#8592; Back
        </button>
        <h1 class="topbar-title" id="setNameTitle">Loading…</h1>
        <div class="topbar-spacer"></div>
    </div>

    <!-- ── LOADING STATE ─────────────────────────────────── -->
    <div class="pack-loading" id="packLoading">
        <div class="spinner"></div>
        <span>Fetching cards…</span>
    </div>

    <!-- ── ERROR STATE ───────────────────────────────────── -->
    <div class="pack-error" id="packError" style="display:none;"></div>

    <!-- ── HINT ──────────────────────────────────────────── -->
    <p class="click-hint" id="clickHint">Click the pack to open it!</p>

    <!-- ── SCENE: PACK ANIMATION ─────────────────────────── -->
    <div class="scene">
        <div class="pack" id="pack" style="display:none;" title="Click to open!">

            <img src="" alt="" id="packLogoImg" class="pack-logo-overlay" style="display:none;" />

            <!-- 1) Tear strip (top_pack.png): rips upward first -->
            <div class="pack-rip" id="packRip" aria-hidden="true">
                <img src="../../assets/images/top_pack.png" alt="" class="pack-rip-img" width="260" height="auto" />
            </div>

            <!-- 2) Body art + foil: drops after the rip -->
            <div class="pack-lower" id="packLower">
                <div class="pack-body-stack">
                    <img src="../../assets/images/bottom_pack.png" alt="" class="pack-body-img" id="packBodyImg" width="260" height="auto" />
                </div>
            </div>
        </div>
    </div>

    <!-- ── CARDS CONTAINER ───────────────────────────────── -->
    <div class="cards-container" id="cardsContainer">
        <!-- 10 card slots -->
        <div class="pokemon-card" data-card="1"  style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
        <div class="pokemon-card" data-card="2"  style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
        <div class="pokemon-card" data-card="3"  style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
        <div class="pokemon-card" data-card="4"  style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
        <div class="pokemon-card" data-card="5"  style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
        <div class="pokemon-card" data-card="6"  style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
        <div class="pokemon-card" data-card="7"  style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
        <div class="pokemon-card" data-card="8"  style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
        <div class="pokemon-card" data-card="9"  style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
        <div class="pokemon-card" data-card="10" style="--card-image: "><div class="pokemon-card-inner"><div class="pokemon-card-back"></div><div class="pokemon-card-front"></div></div></div>
    </div>

    <!-- ── OPEN ANOTHER BUTTON (shown after all cards revealed) ── -->
    <button class="open-another-btn" id="openAnotherBtn" style="display:none;" aria-label="Open another pack">
        🎴 Open Another Pack
    </button>

    <!-- ── CARD TOOLTIP ───────────────────────────────────── -->
    <div class="card-tooltip" id="cardTooltip"></div>

    <!-- ── FETCH DEBUG: add ?debug=1 to the URL ───────────── -->
    <pre id="packFetchDebug" class="pack-fetch-debug" hidden></pre>

    <script type="module" src="../../assets/scripts/pack.js"></script>

    
</body>
</html>
