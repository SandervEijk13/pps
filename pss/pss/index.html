<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pokémon Pack Simulator | Vertical Price List (ALL Fields)</title>
    <link rel="stylesheet" href="/assets/styles/index.css">
    <style>
        /* additional styles for clean vertical price layout */
        .price-vertical {
            margin-top: 10px;
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
            font-size: 11px;
            line-height: 1.4;
            background: #f9fafb;
            border-radius: 12px;
            padding: 10px;
            max-height: 240px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Menlo', monospace;
        }
        .price-vertical section {
            margin-bottom: 12px;
        }
        .price-vertical h4 {
            margin: 0 0 6px 0;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.3px;
            border-left: 3px solid #facc15;
            padding-left: 6px;
            color: #0f172a;
        }
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-left: 6px;
        }
        .price-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #e2e8f0;
            padding: 2px 4px;
        }
        .price-key {
            font-weight: 600;
            color: #334155;
            text-transform: capitalize;
        }
        .price-value {
            font-weight: 500;
            color: #0f172a;
            word-break: break-word;
            text-align: right;
        }
        .variant-group {
            margin-left: 8px;
            margin-top: 6px;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 6px 8px;
        }
        .variant-name {
            font-weight: 800;
            font-size: 10px;
            background: #e2e8f0;
            display: inline-block;
            padding: 0px 6px;
            border-radius: 20px;
            margin-bottom: 4px;
        }
        .subnote {
            font-size: 9px;
            color: #475569;
            text-align: right;
            margin-top: 6px;
            font-style: italic;
        }
        .card-info {
            padding: 10px 12px 12px;
        }
        .pack-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
        }
        .card {
            width: 240px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.1s;
        }
        .card-img img {
            width: 100%;
            height: auto;
            display: block;
            background: #f1f5f9;
        }
        .loading {
            text-align: center;
            padding: 30px;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background: #ef4444;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        button:disabled {
            opacity: 0.5;
        }
        input {
            padding: 8px 15px;
            border-radius: 40px;
            border: 1px solid #cbd5e1;
            width: 200px;
        }
        h3 {
            border-left: 5px solid #facc15;
            padding-left: 12px;
            margin-top: 20px;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
        }
        .price-vertical::-webkit-scrollbar {
            width: 3px;
        }
        .price-vertical::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">

    <h1>⚡ PACK SIMULATOR + VERTICAL PRICE LIST</h1>
    <div class="sub">8 normals · 1 rare/holo · 1 energy | <strong>Every price field listed line‑by‑line (no idProduct)</strong></div>

    <div class="controls">
        <div class="input-group">
            <input id="setCodeInput" value="bw1" placeholder="set code (e.g., swsh3, xy1, sm1)">
        </div>
        <button id="openPackBtn">🔓 OPEN PACK</button>
    </div>

    <div class="loading" id="loadingIndicator">
        <div class="spinner"></div> Loading cards & pricing...
    </div>

    <div id="packInfo" class="pack-info-bar"></div>
    <div id="cardsContainer"></div>

</div>

<script type="module" src="assets/scripts/randomcard.js"></script>
</body>
</html>
