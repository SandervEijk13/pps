<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Set Value Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .controls {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        .summary {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        .summary p {
            margin: 6px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background: #f3f3f3;
            text-align: left;
        }

        .loading {
            color: #666;
        }

        .ev {
            font-size: 22px;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .stat {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            background: white;
        }
    </style>
</head>
<body>

<h1>Pokémon Set Value Calculator</h1>

<div class="controls">
    <input
        id="setId"
        placeholder="e.g. base1, base3, sv3"
        value="base3"
    >

    <button id="loadBtn">
        Calculate
    </button>
</div>

<div id="summary"></div>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Category</th>
            <th>Rarity</th>
            <th>Price</th>
        </tr>
    </thead>

    <tbody id="cardsBody"></tbody>
</table>

<script type="module">

import TCGdex from '@tcgdex/sdk';
import MemoryCache from '@cachex/memory';

const tcgdex = new TCGdex('en');
tcgdex.setCache(new MemoryCache());

function isRare(card) {

    return /rare|holo|v|vmax|vstar|gx|ex|secret|gold/i
        .test((card.rarity || '').toLowerCase());
}

function getCardPrice(card) {

    const p = card.pricing?.cardmarket;

    if (!p) return 0;

    const values = [
        p.low,
        p.trend,
        p.avg1,
        p.avg7,
        p.avg30
    ].filter(v =>
        typeof v === 'number' &&
        v > 0
    );

    if (!values.length) {
        return 0;
    }

    return isRare(card)
        ? Math.max(...values)
        : Math.min(...values);
}

function median(values) {

    if (!values.length) {
        return 0;
    }

    const sorted = [...values].sort((a, b) => a - b);

    const middle =
        Math.floor(sorted.length / 2);

    if (sorted.length % 2 === 0) {

        return (
            sorted[middle - 1] +
            sorted[middle]
        ) / 2;
    }

    return sorted[middle];
}

async function loadSet() {

    const setId =
        document.getElementById('setId')
            .value
            .trim();

    if (!setId) {
        return;
    }

    const summary =
        document.getElementById('summary');

    const cardsBody =
        document.getElementById('cardsBody');

    summary.innerHTML =
        '<p class="loading">Loading...</p>';

    cardsBody.innerHTML = '';

    try {

        const set =
            await tcgdex.fetch('sets', setId);

        const cards = await Promise.all(
            set.cards.map(card =>
                card.getCard
                    ? card.getCard()
                    : tcgdex.card.get(card.id)
            )
        );

        let totalValue = 0;

        for (const card of cards) {

            const price =
                getCardPrice(card);

            totalValue += price;

            const row =
                document.createElement('tr');

            row.innerHTML = `
                <td>${card.localId || ''}</td>
                <td>${card.name}</td>
                <td>${card.category || '-'}</td>
                <td>${card.rarity || '-'}</td>
                <td>€${price.toFixed(2)}</td>
            `;

            cardsBody.appendChild(row);
        }

        const totalCards =
            cards.length;

        const averagePrice =
            totalCards
                ? totalValue / totalCards
                : 0;

        const rareCards =
            cards.filter(card =>
                isRare(card)
            );

        const energyCards =
            cards.filter(card =>
                card.category === 'Energy'
            );

        const commonCards =
            cards.filter(card =>
                !isRare(card) &&
                card.category !== 'Energy'
            );

        const rarePrices =
            rareCards
                .map(getCardPrice)
                .filter(v => v > 0);

        const commonPrices =
            commonCards
                .map(getCardPrice);

        const energyPrices =
            energyCards
                .map(getCardPrice);

        const rareAverage =
            rarePrices.length
                ? rarePrices.reduce(
                    (a,b)=>a+b,0
                ) / rarePrices.length
                : 0;

        const commonAverage =
            commonPrices.length
                ? commonPrices.reduce(
                    (a,b)=>a+b,0
                ) / commonPrices.length
                : 0;

        const energyAverage =
            energyPrices.length
                ? energyPrices.reduce(
                    (a,b)=>a+b,0
                ) / energyPrices.length
                : 0;

        const rareMedian =
            median(rarePrices);

        const hasEnergy =
            energyCards.length > 0;

        const packEV =
            hasEnergy
                ? (
                    commonAverage * 8
                    + rareMedian
                    + energyAverage
                )
                : (
                    commonAverage * 9
                    + rareMedian
                );

        summary.innerHTML = `
            <div class="summary">

                <h2>${set.name}</h2>

                <p>
                    <strong>Total cards:</strong>
                    ${totalCards}
                </p>

                <p>
                    <strong>Total set value:</strong>
                    €${totalValue.toFixed(2)}
                </p>

                <p>
                    <strong>Average card value:</strong>
                    €${averagePrice.toFixed(2)}
                </p>

                <div class="stats">

                    <div class="stat">
                        <strong>Common/Uncommon Avg</strong>
                        <br>
                        €${commonAverage.toFixed(2)}
                    </div>

                    <div class="stat">
                        <strong>Rare+ Avg</strong>
                        <br>
                        €${rareAverage.toFixed(2)}
                    </div>

                    <div class="stat">
                        <strong>Rare+ Median</strong>
                        <br>
                        €${rareMedian.toFixed(2)}
                    </div>

                    <div class="stat">
                        <strong>Energy Avg</strong>
                        <br>
                        €${energyAverage.toFixed(2)}
                    </div>

                </div>

                <hr>

                <p class="ev">
                    Estimated Pack EV:
                    €${packEV.toFixed(2)}
                </p>

                <small>
                    Formula:
                    ${
                        hasEnergy
                        ? '(Common Avg × 8) + Rare Median + Energy Avg'
                        : '(Common Avg × 9) + Rare Median'
                    }
                </small>

            </div>
        `;

        console.log({
            setName: set.name,
            totalCards,
            totalValue,
            averagePrice,
            commonAverage,
            rareAverage,
            rareMedian,
            energyAverage,
            packEV
        });

    } catch (err) {

        console.error(err);

        summary.innerHTML = `
            <div class="summary">
                Failed to load set.
            </div>
        `;
    }
}

document
    .getElementById('loadBtn')
    .addEventListener('click', loadSet);

document
    .getElementById('setId')
    .addEventListener('keydown', e => {

        if (e.key === 'Enter') {
            loadSet();
        }
    });

</script>

</body>
</html>
