<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
        
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <title>Card Marketplace</title>
    <link rel="stylesheet" href="/styles/header.css" />
    <link rel="stylesheet" href="/styles/market.css">
</head>

<body>

    <div id="app-header" data-active="market"></div>

    <div class="page-hero">
        <h1>Marketplace</h1>
        <p>Browse cards listed by other trainers — buy to complete your collection.</p>
    </div>

    <main class="page-body">

        <div class="toolbar">
            <div class="search-wrap">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="pokemonSearch" placeholder="Search Pokémon…">
            </div>
        </div>

        <div id="setFilters"></div>

        <div id="marketplace">
            <!-- Skeleton placeholders shown while JS loads -->
            <div class="card skeleton">
            </div>

    </main>

    <script type="module" src="/scripts/market.js"></script>
    <script src="/scripts/header.js" defer></script>
    <script src="/scripts/login.js" defer></script>
    

</body>

</html>
