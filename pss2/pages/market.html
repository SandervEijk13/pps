<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
        
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <title>Card Marketplace</title>
    <link rel="stylesheet" href="/styles/market.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <div class="header-inner">
                <!-- Logo Left -->
                <div class="logo-area">
                    <div class="logo-icon">
                        <i class="fas fa-database"></i>
                    </div>
                    <a href="/index.html"><span class="logo-text">PokeVault</span></a>
                </div>

                <!-- Centered Navigation (clean, placeholder links) -->
                <div class="nav-links">
                    <a href="pages/market.html" class="nav-link" id="nav-market">
                        <i class="fas fa-chart-line"></i>
                        <span>Market</span>
                    </a>
                    <a href="/pages/crate-opener.html" class="nav-link" id="nav-packs">
                        <i class="fas fa-box-open"></i>
                        <span>Packs</span>
                    </a>
                    <a href="/pages/sets.html" class="nav-link" id="nav-collection">
                        <i class="fas fa-layer-group"></i>
                        <span>Collection</span>
                    </a>
                </div>

                <!-- Right Side: Currency + User Profile -->
                <div class="right-actions">

                    <div class="coin-widget">
                        <div class="coin-icon">
                            <img src="/images/pokecoin.png" alt="PokeCoin" class="coin-img" />
                        </div>
                        <span id="coin-amount">0</span>
                    </div>

                    <!-- USER PROFILE -->
                    <div class="user-profile" id="userProfile">

                        <div class="avatar-icon">
                            <i class="fas fa-user-astronaut"></i>
                        </div>

                        <span class="user-name">Trainer</span>

                        <i class="fas fa-chevron-down dropdown-icon"></i>

                        <!-- DROPDOWN -->
                        <div class="profile-dropdown" id="profileDropdown">

                            <a href="#" class="dropdown-item" id="profileAction">
                                <i class="fas fa-user"></i>
                                <span id="profileActionText">Profile</span>
                            </a>

                            <a href="#" class="dropdown-item" id="authAction">
                                <i class="fas fa-right-to-bracket"></i>
                                <span id="authActionText">Login</span>
                            </a>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="page-hero">
        <h1>Marketplace</h1>
        <p>Browse cards listed by other trainers — buy to complete your collection.</p>
    </div>

    <main class="page-body">

        <div class="toolbar">
            <div class="search-wrap">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="pokemonSearch" placeholder="Search Pokémon…">
            </div>
        </div>

        <div id="setFilters"></div>

        <div id="marketplace">
            <!-- Skeleton placeholders shown while JS loads -->
            <div class="card skeleton">
            </div>

    </main>

    <script type="module" src="/scripts/market.js"></script>
       <script src="/scripts/login.js"></script>
    

</body>

</html>
