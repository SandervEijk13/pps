<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Set Cards | PokeVault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/styles/header.css" />
  <link rel="stylesheet" href="/styles/cards_collection.css">
</head>
<body>
  <div id="app-header" data-active="collection"></div>

  <div class="page-shell">
    <header class="hero">
      <p class="eyebrow">Pokémon TCG</p>
      <h1>Set Card Browser</h1>
      <p class="hero-text">Click any set from the sets page to open a dedicated card browser. If a card image is missing, the card still appears with a fallback placeholder.</p>
    </header>

    <section class="cards-panel">
      <div class="panel-heading">
        <div>
          <h2 id="setTitle">Loading set...</h2>
          <p id="setInfo">Please wait while the set cards load.</p>
          <div class="set-completion-bar" id="setCompletionBar" hidden>
            <div class="set-completion-meta">
              <span id="setCompletionPct">0%</span>
              <span id="setCompletionCount">0/0</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="setCompletionFill" style="width:0%"></div>
            </div>
          </div>
        </div>
        <div class="panel-actions">
          <button type="button" id="bulkSellDuplicatesBtn" class="bulk-sell-btn" hidden>
            <i class="fas fa-clone"></i> Sell Duplicates
          </button>
          <div class="nav-links">
            <a href="/pages/sets.html">← Back to sets</a>
          </div>
        </div>
      </div>

      <div id="cardsGrid" class="cards-grid"></div>
    </section>
  </div>
  <script src="/scripts/notifications.js" defer></script>
  <script type="module" src="/scripts/cards.js"></script>
  <script src="/scripts/header.js" defer></script>
  <script src="/scripts/login.js" defer></script>
 
</body>
</html>
