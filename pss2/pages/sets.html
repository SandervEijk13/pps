<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeVault | Premium Pokémon TCG Collection</title>
  <!-- FontAwesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/styles/sets.css">
</head>
<body>
<div class="container">
 <header class="header">
  <div class="container">
    <div class="header-inner">
      <!-- Logo Left -->
      <div class="logo-area">
        <div class="logo-icon">
          <i class="fas fa-database"></i>
        </div>
        <a href="/index.html"><span class="logo-text">PokeVault</span></a>
      </div>

      <!-- Centered Navigation (clean, placeholder links) -->
      <div class="nav-links">
        <a href="#" class="nav-link" id="nav-market">
          <i class="fas fa-chart-line"></i> 
          <span>Market</span>
        </a>
        <a href="#" class="nav-link" id="nav-packs">
          <i class="fas fa-box-open"></i> 
          <span>Packs</span>
        </a>
        <a href="/pages/sets.html" class="nav-link" id="nav-collection">
          <i class="fas fa-layer-group"></i> 
          <span>Collection</span>
        </a>
      </div>

      <!-- Right Side: Currency + User Profile -->
        <div class="right-actions">

          <div class="coin-widget">
            <div class="coin-icon">
              <img src="/images/pokecoin.png" alt="PokeCoin" class="coin-img" />
            </div>
            <span id="coin-amount">0</span>
          </div>

          <!-- USER PROFILE -->
          <div class="user-profile" id="userProfile">

            <div class="avatar-icon">
              <i class="fas fa-user-astronaut"></i>
            </div>

            <span class="user-name">Trainer</span>

            <i class="fas fa-chevron-down dropdown-icon"></i>

            <!-- DROPDOWN -->
            <div class="profile-dropdown" id="profileDropdown">

              <a href="#" class="dropdown-item" id="profileAction">
                <i class="fas fa-user"></i>
                <span id="profileActionText">Profile</span>
              </a>

              <a href="#" class="dropdown-item" id="authAction">
                <i class="fas fa-right-to-bracket"></i>
                <span id="authActionText">Login</span>
              </a>

            </div>
          </div>
        </div>
    </div>
  </div>
</header>

<div class="page-shell">
  <header class="hero">
    <p class="eyebrow">Pokémon TCG</p>
    <h1>Selected Set Browser</h1>
    <p class="hero-text">Browse the exact Pokémon TCG sets from your spreadsheet in a clean and focused layout.</p>
  </header>

  <section class="sets-panel">
    <div class="panel-heading">
      <h2>Chosen Sets</h2>
      <p>Click a set to open a dedicated cards page with every card from that set.</p>
    </div>

    <div id="eraFilters" class="filter-bar"></div>
    <div class="search-wrapper">
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        id="setSearch"
        class="set-search"
        placeholder="Search Pokémon TCG sets..."
      />
    </div>
    <div id="setsGrid" class="sets-grid"></div>

</div>

<script type="module" src="../scripts/sets.js"></script>
<script src="../scripts/login.js" defer></script>

</body>
</html>
