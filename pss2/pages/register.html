<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeVault | Register</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <link rel="stylesheet" href="/styles/header.css" />
  <link rel="stylesheet" href="/styles/register.css">
</head>

<body>

<div id="app-header"></div>

<main class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-icon">
        <i class="fas fa-user-plus"></i>
      </div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Join PokeVault and start your collection</p>
    </div>

    <div id="messageContainer" class="message-container"></div>

    <div class="auth-form">

      <div class="form-group">
        <label class="form-label" for="regUser">Username</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="regUser"
            class="form-input"
            placeholder="Your trainer name"
            autocomplete="username"
          />
          <i class="fas fa-user input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="regEmail"
            class="form-input"
            placeholder="trainer@example.com"
            autocomplete="email"
          />
          <i class="fas fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="regPassword"
            class="form-input"
            placeholder="••••••••"
            autocomplete="new-password"
            oninput="checkStrength(this.value)"
          />
          <i class="fas fa-lock input-icon"></i>
        </div>
        <div class="strength-bar">
          <div class="strength-segment" id="seg1"></div>
          <div class="strength-segment" id="seg2"></div>
          <div class="strength-segment" id="seg3"></div>
          <div class="strength-segment" id="seg4"></div>
        </div>
        <span class="strength-label" id="strengthLabel"></span>
      </div>

      <p class="terms-note">
        By registering you agree to our
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </p>

      <button class="btn-auth" onclick="register()">
        Create Account
      </button>

      <div class="auth-divider"><span>already a trainer?</span></div>

      <p class="auth-switch">
        <a href="/pages/login.html">Sign in to your account</a>
      </p>

    </div>
  </div>
</main>
<script src="/scripts/notifications.js"></script>
<script src="/scripts/header.js" defer></script>
<script src="/scripts/login.js" defer></script>

<script>
  function checkStrength(val) {
    const segs = [
      document.getElementById('seg1'),
      document.getElementById('seg2'),
      document.getElementById('seg3'),
      document.getElementById('seg4'),
    ];
    const label = document.getElementById('strengthLabel');

    segs.forEach(s => s.className = 'strength-segment');

    if (!val) { label.textContent = ''; return; }

    let score = 0;
    if (val.length >= 8)               score++;
    if (/[A-Z]/.test(val))             score++;
    if (/[0-9]/.test(val))             score++;
    if (/[^A-Za-z0-9]/.test(val))      score++;

    const levels = [
      { cls: 'weak',   text: 'Weak',   color: '#b84040' },
      { cls: 'weak',   text: 'Weak',   color: '#b84040' },
      { cls: 'medium', text: 'Fair',   color: '#c49a1a' },
      { cls: 'strong', text: 'Good',   color: '#1db892' },
      { cls: 'strong', text: 'Strong', color: '#1db892' },
    ];

    const lvl = levels[score];
    for (let i = 0; i < score; i++) segs[i].classList.add(lvl.cls);
    label.textContent = lvl.text;
    label.style.color  = lvl.color;
  }
</script>

</body>
</html>
