<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeVault | Register</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <link rel="stylesheet" href="/styles/login.css">
</head>

<body>

<header class="header">
  <div class="container">
    <div class="header-inner">

      <!-- Logo -->
      <div class="logo-area">

        <div class="logo-icon">
          <i class="fas fa-database"></i>
        </div>

        <a href="/index.html">
          <span class="logo-text">PokeVault</span>
        </a>

      </div>

      <!-- Nav -->
      <div class="nav-links">

        <a href="#" class="nav-link">
          <i class="fas fa-chart-line"></i>
          <span>Market</span>
        </a>

        <a href="#" class="nav-link">
          <i class="fas fa-box-open"></i>
          <span>Packs</span>
        </a>

        <a href="/pages/sets.html" class="nav-link">
          <i class="fas fa-layer-group"></i>
          <span>Collection</span>
        </a>

      </div>

      <!-- Right -->
      <div class="right-actions">

        <div class="coin-widget">

          <div class="coin-icon">
            <img src="/images/pokecoin.png"
              alt="PokeCoin"
              class="coin-img" />
          </div>

          <span id="coin-amount">0</span>
        </div>

        <div class="user-profile" id="userProfile">

          <div class="avatar-icon">
            <i class="fas fa-user-astronaut"></i>
          </div>

          <span class="user-name">Trainer</span>

          <i class="fas fa-chevron-down dropdown-icon"></i>

          <div class="profile-dropdown" id="profileDropdown">

            <a href="#" class="dropdown-item" id="profileAction">
              <i class="fas fa-user"></i>
              <span id="profileActionText">Profile</span>
            </a>

            <a href="#" class="dropdown-item" id="authAction">
              <i class="fas fa-right-to-bracket"></i>
              <span id="authActionText">Login</span>
            </a>

          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<h2>Register</h2>

<input type="text" id="regUser" placeholder="Username">
<input type="email" id="regEmail" placeholder="Email">
<input type="password" id="regPassword" placeholder="Password">

<button onclick="register()">Register</button>

<p onclick="goLogin()" style="cursor:pointer;">
  Already have an account? Login
</p>

<script src="/scripts/login.js" defer></script>

</body>
</html>
